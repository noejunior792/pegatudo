<!DOCTYPE html>
<html>
<head>
  <title>Configurações - PegaTudo</title>
  <link rel="stylesheet" href="../css/features/settings.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../../icons/icon48.png" alt="Logo">
      <h1>Configurações</h1>
    </div>

    <div class="settings-list">
      <div class="setting-item">
        <div class="setting-info">
          <h2>Modo de Depuração</h2>
          <p>Exibe logs detalhados no console do desenvolvedor. Útil para solucionar problemas.</p>
        </div>
        <div class="setting-control">
          <label class="toggle-switch">
            <input type="checkbox" id="debugModeToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      
      <!-- Futuras configurações aparecerão aqui -->

    </div>
  </div>
  <script src="../js/services/settings.js"></script>
</body>
</html>
